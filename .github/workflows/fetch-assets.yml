name: Fetch Commons assets

on:
  push:
    paths:
      - "fetch/**"
      - "!fetch/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-assets-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: Fetch images from Wikimedia Commons
        run: python .github/scripts/fetch_assets.py
      - name: Commit assets to the triggering branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets_cache
          if git diff --cached --quiet; then echo "Rien à commiter"; exit 0; fi
          git commit -m "chore: assets Commons + credits.json [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
